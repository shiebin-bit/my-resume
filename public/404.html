<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting | Lau Shie Bin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var repo = '/my-resume';
      var path = window.location.pathname;
      var route = path.indexOf(repo) === 0 ? path.slice(repo.length) : path;
      var target = repo + '/?redirect=' + encodeURIComponent(route + window.location.search + window.location.hash);
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
